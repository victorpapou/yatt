[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
yatt-core = { path = "crates/yatt-core" }
yatt-store = { path = "crates/yatt-store" }
yatt-platform = { path = "crates/yatt-platform" }
gpui = "=0.2.2"
jiff = { version = "0.2", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
anyhow = "1"
