[package]
name = "yatt-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "yatt's native AppKit views. Renders view-model snapshots, reports UI events."

[dependencies]
yatt-core.workspace = true
yatt-platform.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-web-kit = "0.3"
objc2-core-image = "0.3"
objc2-core-graphics = "0.3"
