[package]
name = "yatt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "yatt macOS app: AppKit views, state in GPUI entities."
publish = false

[[bin]]
name = "yatt"
path = "src/main.rs"

[dependencies]
yatt-core.workspace = true
yatt-store.workspace = true
yatt-engine.workspace = true
yatt-macos.workspace = true
futures.workspace = true
anyhow.workspace = true
# Compile Metal shaders at launch so the build needs only the Command Line Tools,
# not full Xcode. Release builds can switch to precompiled shaders later.
gpui = { workspace = true, features = ["runtime_shaders"] }
jiff.workspace = true
